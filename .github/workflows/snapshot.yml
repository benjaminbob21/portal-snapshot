name: snapshot-sync

# Continuous 6-hour spans: cron fires every 6 hours, each run probes
# every 5 minutes for ~5h55m — near-zero downtime between spans.
# Public repo = unlimited Actions minutes.

on:
  schedule:
    - cron: "7 */6 * * *"  # minute 7 of hours 0,6,12,18 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe loop (every 5 min for ~5h55m)
        env:
          PORTAL_COOKIE: ${{ secrets.PORTAL_COOKIE }}
          PORTAL_CSRF: ${{ secrets.PORTAL_CSRF }}
          PORTAL_UA: ${{ secrets.PORTAL_UA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          SNAPSHOT_STATE: ${{ secrets.SNAPSHOT_STATE }}
        run: |
          set -uo pipefail

          # Restore the last known snapshot from the secret (never committed to git)
          if [ -n "$SNAPSHOT_STATE" ]; then
            mkdir -p state
            printf '%s\n' "$SNAPSHOT_STATE" > state/snapshot.json
            echo "restored snapshot from secret"
          fi

          deadline=$(( $(date +%s) + 21300 ))   # ~5h55m of probing (6h - 5m buffer)
          i=0
          fails=0
          while :; do
            i=$((i+1))
            echo "--- probe #$i $(date -u +%H:%M:%S)Z ---"
            set +e
            python scripts/track.py
            code=$?
            set -e

            # 1 = auth expired / unreadable; the script already DM'd Telegram.
            # Tolerate a couple of transient failures before bailing.
            if [ "$code" = "1" ]; then
              fails=$((fails + 1))
              echo "auth/read failure #$fails"
              if [ "$fails" -ge 3 ]; then
                echo "Giving up until next span."
                exit 1
              fi
            fi

            # Session rotation: if the portal gave a fresh cookie, persist it
            # to the secret so the next probes/runs stay logged in.
            if [ -f state/rotated-session.txt ]; then
              new_sess=$(cat state/rotated-session.txt)
              old_sess=$(printf '%s' "$PORTAL_COOKIE" | sed -n 's/.*session=\([^;]*\).*/\1/p')
              if [ -n "$new_sess" ] && [ "$new_sess" != "$old_sess" ]; then
                new_cookie=$(printf '%s' "$PORTAL_COOKIE" | sed "s/session=[^;]*/session=$new_sess/")
                if gh secret set PORTAL_COOKIE -R "$REPO" --body "$new_cookie"; then
                  echo "rotated session cookie -> secret updated"
                  PORTAL_COOKIE="$new_cookie"
                fi
              fi
              rm -f state/rotated-session.txt
            fi

            [ "$(date +%s)" -ge "$deadline" ] && { echo "5h55m window done."; exit 0; }
            sleep 300
          done

      - name: Persist snapshot to secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f state/snapshot.json ]; then
            gh secret set SNAPSHOT_STATE -R "$REPO" --body "$(cat state/snapshot.json)"
            echo "snapshot persisted to secret"
          fi

      - name: Commit history log
        run: |
          git config user.name "snapshot-sync"
          git config user.email "actions@github.com"
          git add state/history.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "history update $(date -u +%F)"
            git push
          fi
