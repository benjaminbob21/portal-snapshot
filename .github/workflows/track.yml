name: track-portal

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}    # manual run button

permissions:
  contents: write

concurrency:
  group: track-portal
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check portal for updates
        id: check
        env:
          PORTAL_COOKIE: ${{ secrets.PORTAL_COOKIE }}
          PORTAL_CSRF: ${{ secrets.PORTAL_CSRF }}
          PORTAL_UA: ${{ secrets.PORTAL_UA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/track.py

      - name: Commit snapshot & history
        run: |
          git config user.name "portal-tracker"
          git config user.email "actions@github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "snapshot update $(date -u +%F)"
            git push
          fi
